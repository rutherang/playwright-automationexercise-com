trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

schedules:
  - cron: '0 2 * * *'
    displayName: 'Nightly full regression'
    branches:
      include: [main]
    always: true

# Azure's equivalent of GitHub's workflow_dispatch input: a pipeline parameter,
# prompted for when you queue the pipeline manually. Left empty on every
# trigger except a deliberate manual "Run pipeline" click.
parameters:
  - name: feature
    displayName: 'Feature to plan + generate coverage for (leave empty to just run existing tests)'
    type: string
    default: ''

variables:
  - group: claude-agents-secrets   # holds ANTHROPIC_API_KEY as a secret variable

stages:
  # -----------------------------------------------------------------------
  # Stage 1: On-demand plan + generate, via the orchestrator agent.
  # Only runs on a manual trigger with the `feature` parameter filled in.
  # -----------------------------------------------------------------------
  - stage: PlanAndGenerate
    condition: and(eq(variables['Build.Reason'], 'Manual'), ne('${{ parameters.feature }}', ''))
    jobs:
      - deployment: RunOrchestrator
        environment: 'claude-agents'   # requires approval — configure under Pipelines > Environments
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  persistCredentials: true

                - task: NodeTool@0
                  inputs:
                    versionSpec: '20.x'

                - script: npm ci
                - script: npx playwright install --with-deps chromium

                - script: |
                    claude --agent orchestrator \
                      "Add test coverage for: ${{ parameters.feature }}" \
                      --permission-mode acceptEdits
                  displayName: 'Run orchestrator to plan + generate coverage'
                  env:
                    ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)

                - script: |
                    git config user.name "claude-qa-bot"
                    git config user.email "bot@yourcompany.com"
                    BRANCH="qa/generate-$(Build.BuildId)"
                    git checkout -b "$BRANCH"
                    git add qa/plans tests src/pages
                    git commit -m "Add generated coverage for: ${{ parameters.feature }}" || echo "No changes to commit"
                    git push origin "$BRANCH"
                    az extension add --name azure-devops
                    az repos pr create \
                      --title "QA: add coverage for ${{ parameters.feature }}" \
                      --description "Generated by the orchestrator agent. Review the plan in qa/plans/ and the spec in tests/ before merging." \
                      --source-branch "$BRANCH" \
                      --target-branch main \
                      --org $(System.CollectionUri) \
                      --project $(System.TeamProject) \
                      --repository $(Build.Repository.Name)
                  displayName: 'Open PR with generated plan + spec'
                  env:
                    AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

  # -----------------------------------------------------------------------
  # Stage 2: Test — runs on every push/PR/nightly schedule, skipped when
  # this run was the manual plan-and-generate trigger above.
  # -----------------------------------------------------------------------
  - stage: Test
    condition: or(ne(variables['Build.Reason'], 'Manual'), eq('${{ parameters.feature }}', ''))
    jobs:
      - job: RunPlaywrightTests
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'

          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              path: '$(System.DefaultWorkingDirectory)/node_modules'
              restoreKeys: 'npm | "$(Agent.OS)"'
            displayName: 'Cache node_modules'

          - script: npm ci
            displayName: 'Install dependencies'

          - task: Cache@2
            inputs:
              key: 'playwright | "$(Agent.OS)" | package-lock.json'
              path: '$(HOME)/.cache/ms-playwright'
            displayName: 'Cache Playwright browsers'
            name: playwrightCache

          - script: npx playwright install --with-deps chromium
            condition: ne(variables['playwrightCache.cacheHitVar'], 'true')
            displayName: 'Install Playwright browsers (cache miss)'
          - script: npx playwright install-deps chromium
            condition: eq(variables['playwrightCache.cacheHitVar'], 'true')
            displayName: 'Install OS deps only (browsers cached)'

          - script: npm test -- --project=chromium
            name: runTests
            continueOnError: true
            displayName: 'Run Playwright tests'

          - script: npm run qa:failures
            condition: eq(variables['runTests.outcome'], 'Failed')
            displayName: 'Parse failures for triage'

          - publish: '$(System.DefaultWorkingDirectory)/test-results'
            artifact: test-results
            condition: always()

          - publish: '$(System.DefaultWorkingDirectory)/playwright-report'
            artifact: playwright-report
            condition: always()

          - publish: '$(System.DefaultWorkingDirectory)/qa/reports'
            artifact: qa-reports
            condition: always()

          - script: exit 1
            condition: eq(variables['runTests.outcome'], 'Failed')
            displayName: 'Mark stage failed'

  # -----------------------------------------------------------------------
  # Stage 3: Triage + heal — only when Test failed. Deployment job targeting
  # the claude-agents Environment enforces human approval before this runs.
  # -----------------------------------------------------------------------
  - stage: TriageAndHeal
    dependsOn: Test
    condition: failed('Test')
    jobs:
      - deployment: TriageAndHealAgents
        environment: 'claude-agents'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  persistCredentials: true

                - task: NodeTool@0
                  inputs:
                    versionSpec: '20.x'

                - script: npm ci
                - script: npx playwright install --with-deps chromium

                - download: current
                  artifact: qa-reports
                  displayName: 'Download failure report from Test stage'

                - script: |
                    claude --agent triage \
                      "Classify the failures in qa/reports/latest-failures.json" \
                      --permission-mode acceptEdits
                  displayName: 'Run triage agent'
                  env:
                    ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)

                - script: |
                    claude --agent healer \
                      "Fix any failures in qa/reports/latest-triage.md marked as heal" \
                      --permission-mode acceptEdits
                  displayName: 'Run healer agent (healable failures only)'
                  env:
                    ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)

                - script: |
                    git config user.name "claude-healer-bot"
                    git config user.email "bot@yourcompany.com"
                    BRANCH="healer/fix-$(Build.BuildId)"
                    git checkout -b "$BRANCH"
                    git add tests/ src/pages/ qa/reports/
                    git commit -m "Auto-heal: fix failing tests (build $(Build.BuildId))" || echo "No changes to commit"
                    git push origin "$BRANCH"
                    az extension add --name azure-devops
                    az repos pr create \
                      --title "Auto-heal: fix failing Playwright tests" \
                      --description "Generated by the healer agent after pipeline run $(Build.BuildId) failed. Review qa/reports/latest-triage.md — anything marked app_bug was intentionally left unfixed." \
                      --source-branch "$BRANCH" \
                      --target-branch main \
                      --org $(System.CollectionUri) \
                      --project $(System.TeamProject) \
                      --repository $(Build.Repository.Name)
                  displayName: 'Open PR with healed tests'
                  env:
                    AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

  # -----------------------------------------------------------------------
  # Stage 4: Coverage — always runs after Test, pass or fail. Posts a
  # markdown summary attached to the run (Azure's equivalent of GitHub's
  # $GITHUB_STEP_SUMMARY).
  # -----------------------------------------------------------------------
  - stage: Coverage
    dependsOn: Test
    condition: always()
    jobs:
      - deployment: RunCoverageAgent
        environment: 'claude-agents'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: NodeTool@0
                  inputs:
                    versionSpec: '20.x'

                - script: npm ci

                - script: |
                    claude --agent coverage "Check test coverage" --permission-mode acceptEdits
                  displayName: 'Run coverage agent'
                  env:
                    ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)

                - script: |
                    echo "##vso[task.uploadsummary]$(System.DefaultWorkingDirectory)/qa/reports/latest-coverage.md"
                  displayName: 'Post coverage summary to run'

                - publish: '$(System.DefaultWorkingDirectory)/qa/reports/latest-coverage.md'
                  artifact: coverage-report